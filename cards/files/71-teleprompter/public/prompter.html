<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Prompter | Tantra Teleprompter</title>
<style>
  @font-face { font-family: 'Satoshi'; src: url('/satoshi-700.woff2') format('woff2'); font-weight: 700; font-display: swap; }
  @font-face { font-family: 'Satoshi'; src: url('/satoshi-500.woff2') format('woff2'); font-weight: 500; font-display: swap; }
  @font-face { font-family: 'Clash Display'; src: url('/clash-600.woff2') format('woff2'); font-weight: 600; font-display: swap; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  body { color: #fff; font-family: Satoshi, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; }
  #stage { position: fixed; inset: 0; overflow: hidden; }
  #track { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
  #track .b { margin: 0; padding: 0 0 0.6em; white-space: pre-wrap; word-wrap: break-word; font-weight: 700; }
  #track .h { color: #a78bfa; font-family: "Clash Display", Satoshi, sans-serif; font-weight: 600; font-size: 0.55em; text-transform: uppercase; letter-spacing: 0.08em; padding-top: 0.8em; }
  #track .cue { color: #22d3ee; font-weight: 500; }
  #track .end { color: #555; text-align: center; font-size: 0.5em; padding-top: 1em; }
  #marker { position: absolute; left: 0; right: 0; height: 0; pointer-events: none; }
  #marker::before, #marker::after { content: ""; position: absolute; top: -14px; border: 14px solid transparent; }
  #marker::before { left: 0; border-left: 18px solid #a78bfa; }
  #marker::after { right: 0; border-right: 18px solid #a78bfa; }
  #marker .line { position: absolute; left: 24px; right: 24px; border-top: 1px solid rgba(167, 139, 250, 0.3); }
  #hud { position: fixed; top: max(8px, env(safe-area-inset-top)); right: 10px; font: 12px/1 -apple-system, sans-serif; color: #777; display: flex; gap: 8px; align-items: center; z-index: 5; }
  #hud .dot { width: 9px; height: 9px; border-radius: 50%; background: #777; display: inline-block; }
  #hud .dot.online { background: #34d399; } #hud .dot.offline { background: #c2410c; } #hud .dot.connecting { background: #fbbf24; }
  #start { position: fixed; left: 0; right: 0; bottom: 0; padding: 18px 16px max(18px, env(safe-area-inset-bottom)); background: #15141f; color: #fff; text-align: center; font-size: 17px; z-index: 6; border-top: 1px solid #2a2540; border-radius: 20px 20px 0 0; }
  #start .lockup { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px; }
  #start .lockup img.m { height: 30px; } #start .lockup img.w { height: 15px; }
  #start .lockup span { font-family: "Clash Display", Satoshi, sans-serif; font-weight: 600; color: #c9c3ec; font-size: 14px; padding-left: 8px; border-left: 1px solid #2a2540; }
  #start b { color: #fff; }
  #start select { width: 100%; font-size: 17px; padding: 12px; border-radius: 10px; background: #0b0d12; color: #fff; border: 1px solid #2a2540; margin-bottom: 10px; }
  #start button { width: 100%; min-height: 54px; border: 0; border-radius: 14px; background: linear-gradient(160deg, #6d4aff, #4b2fd6); color: #fff; font-size: 17px; font-family: inherit; box-shadow: 0 8px 24px rgba(109, 74, 255, 0.35); }
  #start .sub { color: #a7a3c2; font-size: 13px; margin-top: 6px; }
  #empty { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #777; font-size: 20px; text-align: center; padding: 24px; }
</style>
</head>
<body>
<div id="stage">
  <div id="track"></div>
  <div id="marker"><div class="line"></div></div>
</div>
<div id="empty">No script loaded. Pick one from the remote.</div>
<div id="hud"><span id="hudText">Room</span><span class="dot" id="dot"></span></div>
<div id="start">
  <div class="lockup"><img class="m" src="/tantra-mark.png" alt=""><img class="w" src="/tantra-word.png" alt="Tantra"><span>Teleprompter</span></div>
  <label for="scriptPick" class="sub" style="display:block;margin:0 0 6px">Script on the prompter</label>
  <select id="scriptPick" aria-label="Script"></select>
  <button id="go" type="button"><b>Start</b>: full screen and keep awake</button>
  <div class="sub" id="startSub">Then place the phone on the teleprompter and control it from the remote. Double tap the screen to bring this menu back.</div>
</div>

<script src="/keepawake-media.js"></script>
<script src="/importers.js"></script>
<script src="/common.js"></script>
<script>
(function () {
  'use strict';
  const room = TP.requireCode();
  TP.ensureSession(room).catch(() => {});
  const stage = document.getElementById('stage');
  const track = document.getElementById('track');
  const marker = document.getElementById('marker');
  const emptyEl = document.getElementById('empty');
  const dot = document.getElementById('dot');
  const startEl = document.getElementById('start');
  document.getElementById('hudText').textContent = room;

  let S = null;                 // room state from the server
  let blocks = [];              // parsed script
  let blockEls = [];
  let loadedScript = { id: null, updatedAt: 0 };
  let offset = 0;               // px the track has moved up
  let maxOffset = 0;
  let markerPx = 0;
  let lastFrame = performance.now();
  let firstState = true;
  let tween = null;             // smooth nudges and jumps
  let lastReport = { para: -1, frac: -1, at: 0 };

  const lineH = () => S.fontSize * S.lineHeight;
  const pxPerSec = () => S.speed * 0.085 * lineH();

  function applyLayout() {
    const anchor = currentAnchor();
    track.style.fontSize = S.fontSize + 'px';
    track.style.lineHeight = S.lineHeight;
    track.style.padding = `0 ${S.margin}vw`;
    track.style.textAlign = S.align;
    stage.style.transform = `scale(${S.mirrorX ? -1 : 1}, ${S.mirrorY ? -1 : 1})`;
    measure();
    if (anchor) setAnchor(anchor);
  }

  function measure() {
    markerPx = Math.round(window.innerHeight * S.marker / 100);
    marker.style.top = markerPx + 'px';
    track.style.paddingTop = markerPx + 'px';
    track.style.paddingBottom = window.innerHeight + 'px';
    const last = blockEls[blockEls.length - 1];
    maxOffset = last ? Math.max(0, last.offsetTop + last.offsetHeight - markerPx - lineH() * 0.5) : 0;
  }

  function cueHtml(text) {
    return TP.esc(text).replace(/\[([^\]]*)\]/g, '<span class="cue">[$1]</span>');
  }

  function render() {
    track.innerHTML = '';
    blockEls = blocks.map((b) => {
      const el = document.createElement('div');
      el.className = 'b' + (b.type === 'h' ? ' h' : '');
      el.innerHTML = cueHtml(b.text);
      track.appendChild(el);
      return el;
    });
    if (blocks.length) {
      const end = document.createElement('div'); end.className = 'b end'; end.textContent = 'End of script';
      track.appendChild(end);
    }
    emptyEl.style.display = blocks.length ? 'none' : 'flex';
    measure();
  }

  // Anchor = which block sits on the reading line, and how far through it.
  function currentAnchor() {
    if (!blockEls.length) return null;
    const y = offset + markerPx;
    let i = 0;
    for (let k = 0; k < blockEls.length; k++) { if (blockEls[k].offsetTop <= y) i = k; else break; }
    const el = blockEls[i];
    const frac = Math.min(1, Math.max(0, (y - el.offsetTop) / Math.max(1, el.offsetHeight)));
    return { para: i, frac };
  }
  function anchorOffset(a) {
    const el = blockEls[Math.min(a.para, blockEls.length - 1)];
    if (!el) return 0;
    return el.offsetTop + (a.frac || 0) * el.offsetHeight - markerPx;
  }
  function setAnchor(a) { offset = clampOffset(anchorOffset(a)); paint(); }
  const clampOffset = (v) => Math.min(maxOffset, Math.max(0, v));
  function paint() { track.style.transform = `translate3d(0, ${-offset}px, 0)`; }

  function animateTo(target, ms) {
    tween = { from: offset, to: clampOffset(target), start: performance.now(), ms: ms || 220 };
  }

  function progress() { return maxOffset ? offset / maxOffset : 0; }

  async function loadScript(id, keepPlace) {
    if (!id) { blocks = []; render(); loadedScript = { id: null, updatedAt: 0 }; return; }
    try {
      const sc = await TP.api(TP.scriptsPath(room, id));
      const keep = keepPlace ? currentAnchor() : null;
      blocks = TP_PARSE(sc.text);
      loadedScript = { id: sc.id, updatedAt: sc.updatedAt };
      render(); applyLayout();
      if (keep) setAnchor(keep); else setAnchor(S.anchor || { para: 0, frac: 0 });
      report(true);
    } catch (e) { emptyEl.textContent = 'Could not load the script: ' + e.message; emptyEl.style.display = 'flex'; }
  }
  const TP_PARSE = (t) => TPImport.parseScript(t);


  // Tell the server where the reading line is, so a reload or a second remote stays in step.
  async function report(force) {
    const a = currentAnchor();
    if (!a) return;
    const now = Date.now();
    const moved = a.para !== lastReport.para || Math.abs(a.frac - lastReport.frac) > 0.02;
    if (!force && (!moved || now - lastReport.at < 400)) return;
    lastReport = { ...a, at: now };
    const atEnd = maxOffset > 0 && offset >= maxOffset - 1;
    try { await TP.api(TP.sessionPath(room, '/pos'), { body: { ...a, progress: progress(), atEnd } }); } catch {}
  }
  setInterval(() => report(false), 450);
  window.addEventListener('pagehide', () => report(true));

  function frame(now) {
    const dt = Math.min(0.1, (now - lastFrame) / 1000);
    lastFrame = now;
    if (S && blocks.length) {
      if (tween) {
        const t = Math.min(1, (now - tween.start) / tween.ms);
        const e = 1 - Math.pow(1 - t, 3);
        offset = tween.from + (tween.to - tween.from) * e;
        if (t >= 1) tween = null;
      } else if (S.playing) {
        offset = clampOffset(offset + S.dir * pxPerSec() * dt);
      }
      paint();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  TP.connect(room, 'prompter', {
    status: (s) => { dot.className = 'dot ' + s; },
    state: (st) => {
      const prev = S;
      S = st;
      if (!prev) {
        firstState = false;
        pick.value = S.scriptId || '';
        loadScript(S.scriptId, false);
        applyLayout();
        return;
      }
      if (pick.value !== S.scriptId) pick.value = S.scriptId || '';
      if (S.scriptId !== loadedScript.id) { loadScript(S.scriptId, false); return; }
      const layoutKeys = ['fontSize', 'lineHeight', 'margin', 'marker', 'mirrorX', 'mirrorY', 'align'];
      if (layoutKeys.some((k) => prev[k] !== S[k])) applyLayout();
    },
    cmd: (c) => {
      if (!S) return;
      if (c.type === 'jump') { animateTo(anchorOffset({ para: c.para, frac: 0 }), 300); setTimeout(() => report(true), 350); }
      if (c.type === 'nudge') { animateTo((tween ? tween.to : offset) + c.lines * lineH(), 200); setTimeout(() => report(true), 260); }
    },
    script: (m) => {
      refreshPicker();
      if (S && !m.deleted && m.id === loadedScript.id && m.updatedAt !== loadedScript.updatedAt) loadScript(m.id, true);
    },
  });

  // Keep the reading line in place when the phone rotates or the browser bar changes size.
  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (S) applyLayout(); }, 120); });

  // One tap: full screen and keep awake.
  const wake = TP.keepAwake();
  wake.on().then((mode) => { if (mode === 'wakelock') document.getElementById('startSub').textContent = 'The screen will stay on. Tap to go full screen.'; });
  async function goLive() {
    const el = document.documentElement;
    try { if (!document.fullscreenElement && el.requestFullscreen) await el.requestFullscreen({ navigationUI: 'hide' }); } catch {}
    try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('portrait').catch(() => {}); } catch {}
    await wake.on();
    startEl.style.display = 'none';
  }
  document.getElementById('go').addEventListener('click', goLive);
  // Double tap the screen to bring the menu back.
  let lastTap = 0;
  stage.addEventListener('pointerup', () => {
    const now = Date.now();
    if (now - lastTap < 350) { startEl.style.display = 'block'; refreshPicker(); lastTap = 0; } else lastTap = now;
    wake.on();
  });

  const pick = document.getElementById('scriptPick');
  async function refreshPicker() {
    try {
      const list = await TP.api(TP.scriptsPath(room));
      pick.innerHTML = list.map((x) => `<option value="${TP.esc(x.id)}">${TP.esc(x.title)}</option>`).join('');
      if (S) pick.value = S.scriptId || '';
    } catch {}
  }
  pick.addEventListener('change', () => TP.command(room, { type: 'script', id: pick.value }).catch(() => {}));
  refreshPicker();

  // A keyboard or clicker plugged into the prompter phone works too.
  document.addEventListener('keydown', (e) => {
    const k = e.key;
    const send = (cmd) => TP.command(room, cmd).catch(() => {});
    if (k === ' ' || k === 'Enter') { e.preventDefault(); send({ type: 'toggle' }); }
    else if (k === 'ArrowUp') send({ type: 'speedBy', value: 1 });
    else if (k === 'ArrowDown') send({ type: 'speedBy', value: -1 });
    else if (k === 'ArrowLeft' || k === 'PageUp') send({ type: 'nudge', lines: -3 });
    else if (k === 'ArrowRight' || k === 'PageDown') send({ type: 'nudge', lines: 3 });
  });

  window.__tp = { get offset() { return offset; }, get state() { return S; }, currentAnchor };
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f7fb">
<title>Tantra Funnels</title>
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/themes.js"></script>
<link rel="stylesheet" href="/app.css?v=__BUILD__">
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Sections">
    <div class="brand">
      <img class="word logo-light" src="/tantra-word-ink.png" alt="Tantra">
      <img class="word logo-dark" src="/tantra-word-white.png" alt="Tantra">
      <span class="tag">Funnels</span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <div id="buildStamp"></div>
      <button type="button" id="signOut">Sign out</button>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="mobile-brand">
        <img class="logo-light" src="/tantra-word-ink.png" alt="Tantra">
        <img class="logo-dark" src="/tantra-word-white.png" alt="Tantra">
        <span class="chip">Funnels</span>
      </div>
      <div class="pick" id="funnelPick"></div>
      <div class="pick" id="sessionPick"></div>
      <div class="grow"></div>
      <span class="stamp" id="stamp" aria-live="polite"></span>
      <button class="btn icon" id="refreshBtn" type="button" title="Refresh data now" aria-label="Refresh data now"></button>
      <button class="btn icon" id="themeBtn" type="button" title="Appearance" aria-label="Appearance"></button>
    </header>
    <main class="content" id="content" tabindex="-1">
      <div class="loading">Loading the dashboard…</div>
    </main>
  </div>
</div>
<div class="tip" id="tip" hidden role="status"></div>
<script src="/app.js?v=__BUILD__"></script>
</body>
</html>

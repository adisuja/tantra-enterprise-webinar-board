<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Sign in · Tantra Funnels</title><link rel="icon" href="/favicon.png">
<style>
:root{--bg:#fff;--ink:#0a0a0a;--ink2:#3d3d44;--mute:#5c5c66;--line:rgba(0,0,0,.14);--ocean:#1f6fdc;--bad:#d23a3a;--sans:"SF Pro Display","Inter","Segoe UI",system-ui,-apple-system,sans-serif;--e:cubic-bezier(.2,.8,.2,1)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--ink:#f5f5f6;--ink2:#bdbdc4;--mute:#9a9aa3;--line:rgba(255,255,255,.16);--ocean:#4d9fff;--bad:#ff6464}.art img{filter:invert(1) hue-rotate(180deg);opacity:.6}}
*{box-sizing:border-box;margin:0}html,body{height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{min-height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr)}
.art{position:relative;overflow:hidden}.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1.04) translate(-1%,1%)}to{transform:scale(1.1) translate(1%,-2%)}}
.side{display:flex;flex-direction:column;justify-content:center;padding:48px clamp(24px,6vw,84px)}
.lbl{font:600 13px var(--sans);color:var(--mute)}
h1{font:300 clamp(48px,6vw,84px)/.95 var(--sans);letter-spacing:-.05em;margin:12px 0 14px}
p{color:var(--ink2);max-width:40ch}
form{margin-top:34px;max-width:380px;display:flex;flex-direction:column;gap:12px;animation:rise .6s var(--e) .1s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
label{font:600 13.5px var(--sans);color:var(--ink2)}
.input{font:400 16px var(--sans);color:var(--ink);background:var(--bg);border:0;border-radius:12px;padding:13px 14px;box-shadow:inset 0 0 0 1px var(--line)}
.input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--ocean)}
.btn{margin-top:6px;padding:13px 18px;border:0;border-radius:99px;background:var(--ink);color:var(--bg);font:600 15px var(--sans);cursor:pointer}
.btn:disabled{opacity:.6}#msg{min-height:22px;color:var(--bad);font:600 14px var(--sans)}
@media (max-width:860px){.wrap{grid-template-columns:1fr}.art{height:34vh}}
@media (prefers-reduced-motion:reduce){.art img,form{animation:none}}
</style></head>
<body><div class="wrap"><div class="art" aria-hidden="true"><img src="/img/login-art.jpg" alt=""></div>
<div class="side"><span class="lbl">Tantra Funnels</span><h1>Every funnel, one place.</h1><p>Live numbers from every tool your team uses, from first touch to money in the bank.</p>
<form id="f"><label for="pw">Team password</label><input class="input" id="pw" name="password" type="password" autocomplete="current-password" required autofocus><button class="btn" type="submit">Sign in</button><div id="msg" role="alert"></div></form></div></div>
<script src="/login.js"></script></body></html>

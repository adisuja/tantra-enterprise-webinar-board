<!doctype html>
<html lang="__KIT_LOCALE__" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>__KIT_BRAND_NAME__ Dashboard</title>
<style>
/* =====================================================================
   __KIT_BRAND_NAME_UPPER__ DASHBOARD. Tokens first, then layout.
   Gold = __KIT_BRAND_NAME__ / money, blue = interaction & people, green/red only for better/worse.
   ===================================================================== */
:root{
  --bg:#ffffff; --bg2:#f5f5f5; --paper:#fafafa; --ink:#0a0a0a; --ink2:#3d3d44; --mute:#5c5c66; --line:rgba(0,0,0,.14); --hair:rgba(0,0,0,.07);
  --navy:#26262b; --ocean:#1f6fdc; --ocean-2:#7aaef0; --ocean-soft:rgba(31,111,220,.12); --violet:#6d4fd8;
  --gold:#d4a72c; --gold-t:#8a6a0a; --gold-soft:rgba(212,167,44,.16);
  --good:#0a8a55; --bad:#d23a3a; --ghost:#a8a8b0;
  --shadow:0 14px 40px -14px rgba(0,0,0,.22),0 1px 3px rgba(0,0,0,.06);
  --e:cubic-bezier(.2,.8,.2,1); --dock:60px;
  --sans:"SF Pro Display","Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
:root[data-theme=dark]{
  --bg:#000000; --bg2:#0a0a0a; --paper:#111111; --ink:#f5f5f6; --ink2:#bdbdc4; --mute:#9a9aa3; --line:rgba(255,255,255,.16); --hair:rgba(255,255,255,.08);
  --navy:#d9d9de; --ocean:#4d9fff; --ocean-2:#2f6bb8; --ocean-soft:rgba(77,159,255,.16); --violet:#a78bfa;
  --gold:#d4a72c; --gold-t:#e0b84a; --gold-soft:rgba(212,167,44,.2);
  --good:#27d17f; --bad:#ff6464; --ghost:#5a5a63; --shadow:0 18px 50px -10px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]):not([data-theme=dark]){color-scheme:dark}}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{background:var(--bg);min-height:100dvh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,[tabindex]:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ocean);outline-offset:3px;border-radius:3px}
svg text{font:500 12.5px var(--sans);fill:var(--mute)}
.skip{position:absolute;left:-999px}.skip:focus{left:70px;top:8px;z-index:99;background:var(--paper);padding:6px 10px}
.mono{font-family:var(--mono)}
.lbl{font:600 13px/1.3 var(--sans);letter-spacing:.005em;color:var(--mute)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.035em}
.na{color:var(--mute)}

/* ---------- shell: dock + stage ---------- */
.shell{display:grid;grid-template-columns:var(--dock) minmax(0,1fr);min-height:100dvh}
.dock{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;align-items:center;gap:2px;padding:18px 0;border-right:1px solid var(--hair);z-index:30}
.dock .brand{display:flex;align-items:center;gap:11px;margin-bottom:16px}.dock .brand svg{flex:none}.dock .bw{display:none}
.dk{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--mute);transition:color .2s,background .2s}
.dk svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dk:hover{color:var(--ink);background:var(--hair)}
.dk.on{color:var(--ink);background:var(--paper)}
.dk.on::before{content:"";position:absolute;left:-8px;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--gold)}
.dk .tag{position:absolute;left:54px;top:50%;transform:translateY(-50%) translateX(-4px);white-space:nowrap;padding:5px 10px;border-radius:99px;background:var(--ink);color:var(--bg);font:600 12.5px var(--sans);opacity:0;pointer-events:none;transition:.18s var(--e);z-index:5}
.dk:hover .tag,.dk:focus-visible .tag{opacity:1;transform:translateY(-50%)}
.dock .gap{flex:1}
.dk .tg{display:none}
@media (min-width:1180px){
  :root{--dock:228px}
  .dock{align-items:stretch;padding:20px 14px;gap:3px;overflow-y:auto}
  .dock .brand{padding:0 8px 8px;margin-bottom:10px;border-bottom:1px solid var(--hair)}.dock .bw{display:block}.dock .bw b{display:block;font:700 15.5px/1.1 var(--sans);letter-spacing:.01em}.dock .bw small{display:block;font:400 13px var(--sans);color:var(--mute);margin-top:3px}
  .dk{width:100%;height:auto;min-height:48px;border-radius:12px;display:flex;justify-content:flex-start;align-items:center;gap:13px;padding:8px 12px;text-align:left;color:var(--ink2)}
  .dk .tag{display:none}
  .dk .tg{display:block;min-width:0}.dk .tg b{display:block;font:600 14.5px/1.25 var(--sans);color:inherit}.dk .tg small{display:block;font:400 13px/1.3 var(--sans);color:var(--mute);margin-top:1px}
  .dk.on .tg b{color:var(--ink)}.dk.on{background:var(--paper)}
  .dk.on::before{left:-14px}
  .dk.aux{min-height:44px}.dk.aux .tg b{font-weight:500}
  .dock button.exit{width:100%;font:600 14px var(--sans);letter-spacing:0;text-transform:none;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
  .dock .grp{font:600 13px var(--sans);color:var(--mute);padding:14px 12px 4px}
  .dk .dot{top:12px;left:30px;right:auto}
}
.dock .grp{display:none}@media (min-width:1180px){.dock .grp{display:block}}
.dock .exit{margin-bottom:6px;font:600 13px var(--sans);color:var(--mute);width:44px;text-align:center;padding:8px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.dock .exit:hover{color:var(--ink)}
.dock .dot{position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--gold)}

.stage{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:22px;padding:20px 34px 8px;flex-wrap:wrap}
.crumb{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.crumb b{font:600 14px var(--sans);letter-spacing:0;color:var(--ink)}
.crumb span{color:var(--ink2);font-size:14.5px}
.toks{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tok{position:relative;padding:6px 12px;border-radius:99px;font:500 14px var(--sans);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line);transition:.2s}
.tok:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.tok.on{background:var(--ink);color:var(--bg);box-shadow:none}
.tok .c{opacity:.55;margin-left:4px;font-size:12px}
.tok.clr{box-shadow:none;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.kbd{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--line);color:var(--mute);font-size:14px}
.kbd kbd{font:600 12px var(--mono);padding:2px 6px;border-radius:5px;background:var(--hair);color:var(--ink2)}
@media (max-width:1560px){.kbd span{display:none}}
.kbd:hover{color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

.canvas{flex:1;padding:14px 34px 80px;min-width:0;position:relative}
.canvas.dive{animation:dive .34s var(--e) both}
@keyframes dive{from{opacity:0;transform:scale(var(--z,.985));filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
.rise{animation:rise .55s var(--e) both;animation-delay:calc(var(--d,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.canvas.still .rise,.canvas.still .flow .rv{animation:none}
.flow .rv{animation:wipe 1.15s var(--e) .12s both}.flow.vert .rv{animation-name:wipeY}
@keyframes wipe{from{clip-path:inset(-30% 100% -30% 0)}to{clip-path:inset(-30% -2% -30% 0)}}
@keyframes wipeY{from{clip-path:inset(0 -30% 100% -30%)}to{clip-path:inset(0 -30% -2% -30%)}}
html.noanim *,html.noanim *::before,html.noanim *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}

/* ---------- typography of the canvas ---------- */
.hero-n{font:300 clamp(64px,9.4vw,148px)/.92 var(--sans);letter-spacing:-.055em;font-variant-numeric:tabular-nums;color:var(--ink)}
.hero-n sup{font-size:.42em;vertical-align:top;position:relative;top:.18em;margin-right:.04em;font-weight:300;color:var(--gold-t);letter-spacing:0}
.hero-n.gold{color:var(--gold-t)}
.h2{font:300 clamp(26px,3vw,40px)/1.08 var(--sans);letter-spacing:-.03em}
.h3{font:600 15px/1.3 var(--sans);letter-spacing:-.01em}
.sub{color:var(--ink2);font-size:15px;max-width:62ch}
.sub b{color:var(--ink);font-weight:600}
.up{color:var(--good)}.dn{color:var(--bad)}
.link{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;transition:.2s}.link:hover{text-decoration-color:var(--gold)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font:600 12.5px var(--sans);letter-spacing:.01em;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink2)}
.pill.top{background:var(--gold-soft);color:var(--gold-t);box-shadow:none}.pill.low{background:rgba(210,58,58,.12);color:var(--bad);box-shadow:none}.pill.prov{border-style:dashed}
.sec{margin-top:54px}
.sec-h{display:flex;align-items:baseline;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.sec-h .lbl{flex:0 1 auto;min-width:0}.sec-h .sp{flex:1}
.ico-btn{display:inline-flex;align-items:center;gap:6px;color:var(--mute);font-size:14px;padding:4px 8px;border-radius:99px;transition:.2s}.ico-btn:hover{color:var(--ink);background:var(--hair)}

/* ---------- overview composition (asymmetric, no card grid) ---------- */
.ov{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);grid-template-areas:"left river" "land land";gap:40px 72px;align-items:start}
.ov .ovl{grid-area:left;display:flex;flex-direction:column;gap:40px;min-width:0}.ov .riverbox{grid-area:river}.ov .landp{grid-area:land;margin-top:24px;min-width:0}
.hero{padding-top:12px}
.hero .lbl{display:block;margin-bottom:18px}
.hero .ctx{margin-top:22px;display:flex;gap:28px;flex-wrap:wrap;align-items:baseline;font-size:15px;color:var(--ink2)}
.hero .ctx b{font-weight:600;color:var(--ink)}
.split{margin-top:26px;max-width:760px}
.split .tr{display:flex;height:10px;gap:3px}
.split .tr i{display:block;height:100%;transition:flex .5s var(--e);cursor:pointer}
.split .a{background:var(--gold)}.split .u{background:repeating-linear-gradient(135deg,var(--gold-soft) 0 4px,transparent 4px 8px);box-shadow:inset 0 0 0 1px var(--gold)}
.split .cap{display:flex;justify-content:space-between;gap:20px;margin-top:10px;font-size:14px;color:var(--ink2);flex-wrap:wrap}
.worth{max-width:780px}
.wl{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:0 14px;padding:15px 4px;border-top:1px solid var(--hair);cursor:pointer;transition:.2s;align-items:baseline}
.wl:last-child{border-bottom:1px solid var(--hair)}
.wl:hover{background:linear-gradient(90deg,var(--hair),transparent)}
.wl .i{font:600 13px var(--sans);color:var(--gold-t)}
.wl b{font-weight:600}.wl span.t{color:var(--ink2);font-size:15px;display:block;margin-top:2px}
.wl .go{color:var(--mute);font-size:18px;transition:.2s}.wl:hover .go{color:var(--ink);transform:translateX(4px)}
.riverbox{position:relative;min-width:0;max-width:400px}
.riverbox .lbl{display:flex;justify-content:space-between;margin-bottom:6px}

/* ---------- flow (journey river) ---------- */
.flow{display:block;width:100%;height:auto;overflow:visible}
.flow .rb{transition:opacity .25s}
.flow .nd{cursor:pointer;transition:opacity .25s}
.flow .nd .bar{fill:var(--ocean);transition:.25s}
.flow .nd.m .bar{fill:var(--gold)}
.flow .nd .v{font:300 26px var(--sans);letter-spacing:-.04em;fill:var(--ink);font-variant-numeric:tabular-nums}
.flow .nd .n{font:600 13px var(--sans);letter-spacing:0;fill:var(--mute)}
.flow .nd .r{font:500 13px var(--sans);fill:var(--ink2)}
.flow .nd.ghost .bar{fill:none;stroke:var(--ghost);stroke-dasharray:3 3}
.flow .nd.ghost .v{fill:var(--ghost);font-size:20px}
.flow .nd .hit{fill:transparent}
.flow:has(.nd:hover) .nd:not(:hover),.flow:has(.nd:focus-visible) .nd:not(:focus-visible){opacity:.38}
.flow .nd:hover .bar,.flow .nd:focus-visible .bar{filter:drop-shadow(0 0 6px var(--ocean))}
.flow .nd.m:hover .bar{filter:drop-shadow(0 0 7px var(--gold))}
.flow .pulse{fill:none;stroke:var(--ocean);stroke-width:1.2;stroke-dasharray:2 14;opacity:.7;animation:dash 2.6s linear infinite}
.flow .pulse.m{stroke:var(--gold)}
@keyframes dash{to{stroke-dashoffset:-32}}
.flow .loss{font:500 12px var(--sans);fill:var(--mute)}
.flow .draw{stroke-dasharray:1;stroke-dashoffset:0}
.flow-fs .flow{max-height:80dvh}

/* ---------- landscape ---------- */
.land{position:relative;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.land svg{display:block;overflow:visible}
.land .bub{cursor:pointer;transition:opacity .25s}
.land .bub circle.c{transition:fill .2s}
.land.dim .bub{opacity:.22}.land.dim .bub.hot{opacity:1}
.land .bub.out{opacity:.16}
.land .bub text{font:600 12.5px var(--sans);fill:var(--ink)}
.land .bub text.vv{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;font:500 12.5px var(--sans);fill:var(--ink2)}
.land .bub.sel circle.c{stroke:var(--ink);stroke-width:2}
.land .stem{stroke:var(--line);stroke-width:1}
.land .gridl{stroke:var(--hair)}
.land .brush{fill:var(--ocean-soft);stroke:var(--ocean);stroke-dasharray:3 3}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chp{padding:4px 11px;border-radius:99px;font:500 14px var(--sans);color:var(--ink2);transition:.2s}
.chp:hover{background:var(--hair)}.chp.on{background:var(--ink);color:var(--bg)}
.tray{margin-top:18px;padding:16px 0;border-top:1px solid var(--ink);display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}

.upc{display:flex;align-items:baseline;gap:6px 24px;flex-wrap:wrap;width:100%;max-width:760px;margin-top:26px;padding:14px 16px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);text-align:left;font-size:15px;color:var(--ink2);transition:.2s;background:linear-gradient(90deg,var(--gold-soft),transparent 70%)}
.upc:hover{box-shadow:inset 0 0 0 1px var(--ink)}.upc .lbl{flex-basis:100%}.upc b{color:var(--ink);font-weight:600}.upc-d b{font:300 28px var(--sans);letter-spacing:-.03em}.upc-w{color:var(--gold-t);font-weight:600}.upc i{margin-left:auto;font-style:normal;color:var(--mute);font-size:18px;align-self:center}
.foot{display:flex;gap:8px 24px;flex-wrap:wrap;margin-top:70px;padding-top:16px;border-top:1px solid var(--hair);font-size:13.5px;color:var(--mute)}.foot b{color:var(--ink);font-weight:600}.foot .sp{flex:1}.foot.old{color:var(--gold-t);border-top-color:var(--gold)}.foot.old span:last-child{font-weight:600}
.ask{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.ask button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;padding:13px 2px;border-top:1px solid var(--hair);align-items:baseline;transition:.2s}
.ask button b{font-weight:600;font-size:15.5px}.ask button span{grid-column:1;color:var(--ink2);font-size:14px}.ask button i{grid-row:1/3;grid-column:2;font-style:normal;color:var(--mute);font-size:18px;align-self:center;transition:.2s}
.ask button:hover{background:linear-gradient(90deg,var(--hair),transparent)}.ask button:hover i{color:var(--ink);transform:translateX(4px)}
.guide-btn{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--line);font-size:14px;color:var(--ink2)}.guide-btn:hover{box-shadow:inset 0 0 0 1px var(--ink);color:var(--ink)}
.guide-btn b{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--bg);font:600 12px var(--sans)}
.steps{list-style:none;padding:0;counter-reset:s}.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:10px;padding:14px 0;border-top:1px solid var(--hair);font-size:15px}
.steps li::before{content:counter(s);font:600 13px var(--mono);color:var(--gold-t);padding-top:2px}.steps li b{font-weight:600}
.key{display:grid;grid-template-columns:22px 1fr;gap:6px 12px;align-items:center;font-size:15px;margin-top:6px}.key i{display:block;width:16px;height:16px;border-radius:50%}
@media (max-width:760px){.ask{grid-template-columns:1fr}}
/* ---------- ledgers (tables are secondary) ---------- */
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14.5px}
th{font:600 13px var(--sans);letter-spacing:0;color:var(--mute);text-align:right;padding:8px 10px;border-bottom:1px solid var(--ink);white-space:nowrap;cursor:pointer}
th.l,td.l{text-align:left}th:hover{color:var(--ink)}
td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--hair);white-space:nowrap}
tbody tr{cursor:pointer;transition:background .15s}tbody tr:hover{background:var(--hair)}
.tw{overflow-x:auto}
.rows .row{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) auto;gap:14px;align-items:center;padding:7px 0;cursor:pointer}
.rows .row .bar2{height:8px;background:var(--hair);position:relative;border-radius:4px;overflow:hidden}
.rows .row .bar2 i{position:absolute;left:0;top:0;bottom:0;background:var(--ocean);border-radius:4px;transition:width .5s var(--e)}
.rows .row.gold .bar2 i{background:var(--gold)}
.rows .row:hover .bar2 i{filter:brightness(1.15)}
.rows .row .k{font-size:14.5px;color:var(--ink2)}.rows .row .vv{font-size:14.5px;font-weight:600;text-align:right;min-width:60px}
.dim-others:has(.row:hover) .row:not(:hover){opacity:.45}
.row,.wl,.bub{transition:opacity .2s}

/* ---------- compact states (never giant empty boxes) ---------- */
.state{display:inline-flex;align-items:baseline;gap:10px;padding:8px 0;color:var(--mute);font-size:14.5px;border-bottom:1px dashed var(--line);margin:0 22px 8px 0}
.state b{font:600 13px var(--sans);letter-spacing:0}
.states{margin-top:16px}

/* ---------- columns used by workspaces ---------- */
.cols{display:grid;gap:44px 72px}
.c2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.c21{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}.c12{grid-template-columns:minmax(0,1fr) minmax(0,1.7fr)}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.big3{display:flex;gap:44px;flex-wrap:wrap}
.bn{min-width:120px}.bn .v{font:300 clamp(34px,3.6vw,54px)/1 var(--sans);letter-spacing:-.045em;font-variant-numeric:tabular-nums}.bn .lbl{display:block;margin-top:8px}.bn .s{font-size:14px;color:var(--ink2);margin-top:4px}
.wh{padding:6px 0 0}.wh .meta{display:flex;gap:14px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.wtabs{display:flex;gap:2px;margin:30px 0 8px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.wtabs button{padding:10px 16px;font-size:15px;color:var(--mute);position:relative;white-space:nowrap;transition:color .2s}
.wtabs button:hover{color:var(--ink)}.wtabs button.on{color:var(--ink);font-weight:600}
.wtabs button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--gold)}
.verdict{border-left:2px solid var(--gold);padding:2px 0 2px 18px;max-width:60ch}
.verdict p+p{margin-top:10px}.verdict b{font-weight:600}
.sig{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:6px 28px;padding:26px 0;border-top:1px solid var(--hair);align-items:start}
.sig .lbl{padding-top:10px}.sig .lbl.rev{color:var(--gold-t)}.sig .lbl.act{color:var(--ocean)}
.sig .st{font:300 clamp(22px,2.4vw,32px)/1.18 var(--sans);letter-spacing:-.025em;max-width:30ch}
.sig .st b{font-weight:500}
.sig .ev{grid-column:2;font-size:14.5px;color:var(--ink2);max-width:62ch}
.sig .acts{display:flex;gap:8px;grid-row:1/3;grid-column:3;align-self:center}
.btn{padding:8px 16px;border-radius:99px;font:600 14px var(--sans);box-shadow:inset 0 0 0 1px var(--ink);transition:.2s;white-space:nowrap}
.btn:hover{background:var(--ink);color:var(--bg)}.btn.q{box-shadow:inset 0 0 0 1px var(--line);color:var(--ink2)}
.ledger .li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:18px;padding:11px 0;border-top:1px solid var(--hair);font-size:15px;align-items:baseline}
.ledger .li small{display:block;color:var(--mute);font-size:13.5px;margin-top:2px}
.sv{font:600 12.5px var(--sans);letter-spacing:.01em;padding:2px 8px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink2);white-space:nowrap}

/* ---------- floating layers ---------- */
#tip{position:fixed;z-index:90;pointer-events:none;max-width:320px;padding:12px 14px;background:var(--ink);color:var(--bg);border-radius:10px;font-size:14px;line-height:1.45;opacity:0;transform:translateY(4px);transition:opacity .14s,transform .14s;box-shadow:var(--shadow)}
#tip.on{opacity:1;transform:none}
#tip b{font-weight:600}#tip .tl{font:600 13px var(--sans);letter-spacing:0;opacity:.7;display:block;margin-bottom:4px}#tip .tv{font:300 24px/1.1 var(--sans);letter-spacing:-.03em;display:block;margin-bottom:6px}#tip .tr2{display:flex;justify-content:space-between;gap:16px;opacity:.9}#tip .tr2 span:first-child{opacity:.65}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);z-index:70;background:var(--paper);box-shadow:var(--shadow);transform:translateX(104%);transition:transform .36s var(--e);overflow-y:auto;padding:30px 32px 60px}
.drawer.on{transform:none}
.drawer .x{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line);font-size:16px;color:var(--ink2)}.drawer .x:hover{background:var(--ink);color:var(--bg)}
.drawer h2{font:300 clamp(40px,5vw,64px)/1 var(--sans);letter-spacing:-.05em;margin:10px 0 6px;font-variant-numeric:tabular-nums}
.drawer h4{margin:30px 0 8px}
.pop{position:fixed;z-index:80;min-width:250px;max-width:340px;max-height:70dvh;overflow:auto;background:var(--paper);box-shadow:var(--shadow);border-radius:14px;padding:12px;opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:.2s var(--e)}
.pop.on{opacity:1;transform:none;pointer-events:auto}
.pop label{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;font-size:15px;cursor:pointer}.pop label:hover{background:var(--hair)}
.pop input{accent-color:var(--ocean)}.pop .grp{margin:8px 8px 4px}
.pop select{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%;margin-bottom:6px}
.pal{position:fixed;inset:0;z-index:100;display:none;align-items:flex-start;justify-content:center;padding-top:14vh;background:rgba(0,0,0,.5)}
.pal.on{display:flex}
.pal .box{width:min(640px,calc(100vw - 24px));background:var(--paper);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;animation:rise .25s var(--e)}
.pal input{width:100%;border:0;background:none;color:var(--ink);font:300 24px var(--sans);letter-spacing:-.02em;padding:22px 24px;border-bottom:1px solid var(--hair);outline:0}
.pal ul{list-style:none;padding:8px;max-height:46dvh;overflow:auto}
.pal li{display:flex;gap:12px;align-items:baseline;padding:10px 14px;border-radius:10px;cursor:pointer;font-size:14px}
.pal li.on{background:var(--ink);color:var(--bg)}.pal li small{margin-left:auto;font:500 13px var(--sans);opacity:.6}
.pal li em{font-style:normal;opacity:.6;font-size:14px}
.pal .foot{padding:10px 18px;border-top:1px solid var(--hair);font-size:13px;color:var(--mute);display:flex;gap:16px}
.dbg{margin-top:70px;padding-top:20px;border-top:1px dashed var(--line);font:13.5px/1.55 var(--mono);color:var(--ink2);white-space:pre-wrap}
.fsbtn{position:absolute;right:0;top:-6px}
.fs-on{position:fixed!important;inset:0;z-index:55;background:var(--bg);padding:70px 5vw 40px;overflow:auto}


/* ---------- overview (v4): simple answer first, detail one click away ---------- */
.h1{font:500 clamp(32px,4vw,52px)/1.06 var(--sans);letter-spacing:-.04em}
.lead{font-size:clamp(16px,1.5vw,18px);color:var(--ink2);max-width:58ch;margin-top:10px}
.ph{padding-top:10px}
.ph .scope{display:block;margin-top:14px;font-size:14px;color:var(--mute)}
.os{margin-top:60px}
.os>.sec-h{margin-bottom:18px}
.os .h2{font-weight:500;letter-spacing:-.035em}
.os .q{font:500 clamp(22px,2.3vw,30px)/1.2 var(--sans);letter-spacing:-.03em;max-width:34ch}
.os .q b{font-weight:600}.os .q-sub{margin-top:8px;font-size:15px;color:var(--ink2)}
.snap{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-top:26px}
.kpi{display:flex;flex-direction:column;gap:6px;text-align:left;padding:18px 18px 16px;border-radius:16px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--hair);min-width:0;transition:transform .2s var(--e),box-shadow .2s,background .2s}
.kpi.clk{cursor:pointer}.kpi.clk:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px var(--line),var(--shadow)}
.kpi .lbl{color:var(--ink2)}
.kv{font:500 clamp(34px,3.2vw,44px)/1 var(--sans);letter-spacing:-.045em;font-variant-numeric:tabular-nums;color:var(--ink)}
.kv sup{font-size:.5em;vertical-align:top;position:relative;top:.12em;margin-right:.04em;font-weight:500;color:var(--gold-t);letter-spacing:0}
.kv.gold,.kpi.money .kv{color:var(--gold-t)}
.kpi p{font-size:14px;line-height:1.4;color:var(--mute)}
.snap-note{margin-top:14px;font-size:14px;color:var(--mute)}
.tchips{margin:20px 0 6px}
.tc{display:block;width:100%;height:auto;overflow:visible}
.tc .gl{stroke:var(--hair)}.tc text{font:500 13px var(--sans);fill:var(--mute)}
.tc .ln{fill:none;stroke:var(--gold);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.tc .av{stroke:var(--ghost);stroke-dasharray:4 5}
.tc circle{cursor:pointer;transition:r .15s}.tc circle:hover{r:7}
.tc circle.o{fill:var(--bg);stroke:var(--gold);stroke-width:2}.tc circle.f{fill:var(--gold);stroke:var(--bg);stroke-width:2}
.tc .xl{fill:var(--mute)}
.chg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 32px}
.chg h3{font:600 15px var(--sans);display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.chg h3 i{width:8px;height:8px;border-radius:50%;background:var(--ghost)}.chg .imp h3 i{background:var(--good)}.chg .dec h3 i{background:var(--bad)}.chg .unu h3 i{background:var(--violet)}.chg .std h3 i{background:var(--gold)}
.chg ul{list-style:none;padding:0}.chg li{padding:11px 0;border-bottom:1px solid var(--hair);font-size:14.5px;line-height:1.45;color:var(--ink2);cursor:pointer;transition:background .15s}
.chg li:hover{color:var(--ink)}.chg li b{color:var(--ink);font-weight:600}.chg li.none{cursor:default;color:var(--mute)}
.bw2{display:grid;grid-template-columns:1fr 1fr;gap:12px 48px}
.bw2 h3{font:600 15px var(--sans);padding-bottom:10px;border-bottom:1px solid var(--line)}
.rk{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:2px 12px;padding:14px 4px;border-bottom:1px solid var(--hair);cursor:pointer;align-items:baseline;transition:background .2s}
.rk:hover{background:linear-gradient(90deg,var(--hair),transparent)}
.rk .n{font:600 20px var(--sans);color:var(--gold-t);letter-spacing:-.03em}.bw2 .weak .rk .n{color:var(--mute)}
.rk b{font-weight:600;font-size:16px}.rk .r{grid-column:2;font-size:14.5px;color:var(--ink2)}.rk .f{grid-column:2;font-size:13.5px;color:var(--mute)}
.rk .go{grid-row:1/4;grid-column:3;align-self:center;color:var(--mute);font-size:18px;transition:.2s}.rk:hover .go{color:var(--ink);transform:translateX(4px)}
.att{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1.15fr) minmax(0,1.15fr) auto;gap:6px 28px;padding:20px 4px;border-top:1px solid var(--hair);cursor:pointer;align-items:start;transition:background .2s}
.att:last-of-type{border-bottom:1px solid var(--hair)}
.att:hover{background:linear-gradient(90deg,var(--hair),transparent)}
.att .i{font:600 15px var(--sans);color:var(--gold-t);padding-top:2px}
.att .cl .k{display:block;font:600 13px var(--sans);color:var(--mute);margin-bottom:3px}
.att .cl p{font-size:15px;line-height:1.45;color:var(--ink2)}.att .cl p b{color:var(--ink);font-weight:600}
.att .cl.h b{font:600 17px/1.3 var(--sans);color:var(--ink);letter-spacing:-.01em;display:block}
.att .vd{align-self:center;font:600 14px var(--sans);color:var(--ink2);white-space:nowrap;transition:.2s}.att:hover .vd{color:var(--ink);transform:translateX(3px)}
details.deeper{margin-top:60px;border-top:1px solid var(--line)}
details.deeper summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:18px 2px;font:600 15px var(--sans);color:var(--ink2)}
details.deeper summary::-webkit-details-marker{display:none}
details.deeper summary::before{content:"+";display:grid;place-items:center;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line);font-weight:500;transition:transform .2s}
details.deeper[open] summary::before{content:"\2013"}
details.deeper summary:hover{color:var(--ink)}
details.deeper[open]>.dp{animation:rise .4s var(--e) both}
.dp{padding:6px 0 10px}
@media (min-width:1100px){.snap{grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}.kpi{padding:16px 14px 14px}.kv{font-size:clamp(28px,2.4vw,36px)}}
@media (max-width:1100px){.chg{grid-template-columns:1fr 1fr}}
@media (max-width:760px){
  .snap{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:14px 14px 12px;border-radius:14px}.kv{font-size:32px}
  .chg,.bw2{grid-template-columns:1fr}
  .att{grid-template-columns:26px minmax(0,1fr);gap:8px 12px}.att .cl,.att .vd{grid-column:2}.att .vd{align-self:start}
  .os{margin-top:44px}
}
@media (max-width:420px){.snap{grid-template-columns:1fr 1fr}.kpi p{font-size:13px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- responsive: designed for the thumb, not collapsed ---------- */
@media (max-width:1100px){.ov{grid-template-columns:1fr;grid-template-areas:"left" "river" "land"}.ov .riverbox{max-width:420px}.c2,.c21,.c12,.c3{grid-template-columns:1fr}.cols{gap:36px}}
@media (max-width:760px){
  :root{--dock:0px}
  .shell{grid-template-columns:1fr}
  .dock{position:fixed;top:auto;bottom:0;left:0;right:0;height:62px;flex-direction:row;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line);border-right:0;z-index:50;gap:0}
  .dock .brand,.dock .gap,.dock .tag,.dk.aux,.dock .grp{display:none}
  .dock{overflow-x:auto;justify-content:flex-start;scrollbar-width:none}.dk{flex-direction:column;gap:2px;justify-content:center;flex:none;min-width:64px;padding:4px 6px}.dk .tg{display:block}.dk .tg b{font:500 12px/1.2 var(--sans)}.dk .tg small{display:none}
  .dk{width:auto;height:54px;border-radius:12px}.dk svg{width:19px;height:19px}.crumb{order:0}.kbd{order:1;margin-left:auto}.topbar .toks{order:2}.dk.on::before{left:25%;right:25%;top:auto;bottom:-6px;width:auto;height:3px}
  .dock .exit{margin:0;border:0;width:auto;flex:none;padding:0 8px}
  .topbar{padding:14px 16px 4px;gap:10px}.topbar .toks{width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.tok{flex:none}.kbd span{display:none}
  .canvas{padding:8px 16px 96px}
  .hero-n{font-size:clamp(58px,19vw,88px)}
  .pager{display:flex;gap:6px;position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0;overflow-x:auto;scrollbar-width:none}
  .pager button{flex:none;padding:5px 12px;border-radius:99px;font-size:14px;color:var(--mute);box-shadow:inset 0 0 0 1px var(--line)}.pager button.on{background:var(--ink);color:var(--bg);box-shadow:none}
  .ov{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:28px;margin:0 -16px;padding:0 16px 20px;scroll-padding:0 16px;scrollbar-width:none}
  .ov .ovl{display:contents}.ov>*,.ov .ovl>*{flex:0 0 calc(100vw - 32px);scroll-snap-align:start;min-width:0;margin-top:0!important}
  .ov .hero{order:0}.ov .riverbox{order:1;max-width:none}.ov .landp{order:2}.ov .worth{order:3}
  .ov .landp svg{max-width:100%}
  .sig{grid-template-columns:1fr}.sig .ev,.sig .acts{grid-column:1;grid-row:auto}
  .drawer{top:auto;left:0;right:0;width:100%;max-height:86dvh;border-radius:22px 22px 0 0;transform:translateY(104%);padding:26px 20px 50px}
  .drawer.on{transform:none}
  .sec{margin-top:40px}.rows .row{grid-template-columns:90px minmax(0,1fr) auto}
  .wl{grid-template-columns:26px minmax(0,1fr) auto}
}
@media (min-width:761px){.pager{display:none}}
@media print{.dock,.bar,.drawer,.pal{display:none}}

<script>
